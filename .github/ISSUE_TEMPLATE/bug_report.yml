name: Bug report
description: Report a reproducible application or calculation problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic trade data. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include trade inputs and relevant settings for calculation issues.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Android/device or browser/version; app version or commit"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Redacted screenshots, logs, or a minimal example.
